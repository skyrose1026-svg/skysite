<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Three fishing rod styles</title>
  <desc id="desc">Spinning, casting, and fly rods shown as long rods with different handles and guides.</desc>
  <rect width="640" height="360" rx="28" fill="#eaf5f2"/>
  <g fill="none" stroke="#155e75" stroke-linecap="round">
    <path d="M75 100L565 48" stroke-width="8"/>
    <path d="M75 180L565 170" stroke="#166534" stroke-width="7"/>
    <path d="M75 260L565 292" stroke="#b45309" stroke-width="6"/>
  </g>
  <g fill="#57534e">
    <rect x="34" y="88" width="70" height="24" rx="8"/>
    <rect x="34" y="168" width="70" height="24" rx="8"/>
    <rect x="34" y="248" width="70" height="24" rx="8"/>
  </g>
  <g fill="none" stroke="#0e7490" stroke-width="3">
    <circle cx="190" cy="88" r="9"/><circle cx="315" cy="75" r="7"/><circle cx="440" cy="61" r="5"/>
    <circle cx="205" cy="177" r="8"/><circle cx="340" cy="174" r="6"/><circle cx="465" cy="172" r="4"/>
    <circle cx="215" cy="269" r="7"/><circle cx="350" cy="278" r="5"/><circle cx="480" cy="286" r="3"/>
  </g>
  <g fill="#1c1917" font-family="system-ui,sans-serif" font-size="18" font-weight="700">
    <text x="112" y="108">SPINNING</text>
    <text x="112" y="188">CASTING</text>
    <text x="112" y="268">FLY</text>
  </g>
