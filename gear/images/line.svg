<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">Fishing line types</title>
  <desc id="desc">Three spools and fine lines represent monofilament, fluorocarbon, and braided fishing line.</desc>
  <rect width="640" height="360" rx="28" fill="#eaf5f2"/>
  <g transform="translate(95 75)">
    <rect width="110" height="190" rx="20" fill="#fff" stroke="#155e75" stroke-width="7"/>
    <ellipse cx="55" cy="95" rx="34" ry="70" fill="none" stroke="#0e7490" stroke-width="8"/>
    <path d="M55 25v140" stroke="#0e7490" stroke-width="3"/>
  </g>
  <g transform="translate(265 75)">
    <rect width="110" height="190" rx="20" fill="#fff" stroke="#155e75" stroke-width="7"/>
    <ellipse cx="55" cy="95" rx="34" ry="70" fill="none" stroke="#166534" stroke-width="8"/>
    <path d="M55 25v140" stroke="#166534" stroke-width="3"/>
  </g>
  <g transform="translate(435 75)">
    <rect width="110" height="190" rx="20" fill="#fff" stroke="#155e75" stroke-width="7"/>
    <ellipse cx="55" cy="95" rx="34" ry="70" fill="none" stroke="#b45309" stroke-width="8" stroke-dasharray="4 5"/>
    <path d="M55 25v140" stroke="#b45309" stroke-width="3"/>
  </g>
  <g fill="#1c1917" font-family="system-ui,sans-serif" font-size="15" font-weight="700" text-anchor="middle">
    <text x="150" y="310">MONO</text><text x="320" y="310">FLUOROCARBON</text><text x="490" y="310">BRAID</text>
  </g>
</svg>
